[package]
name = "querybook-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "shared" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["Storage", "Element", "HtmlElement", "HtmlTextAreaElement", "KeyboardEvent", "MouseEvent"] }

[workspace]
members = ["src-tauri", "shared"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
