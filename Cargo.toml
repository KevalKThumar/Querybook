[package]
name = "querybook-ui"
version = "0.1.0"
description = "Querybook user interface (Leptos, compiled to WebAssembly)"
authors = ["Keval Thumar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KevalKThumar/Querybook"
edition = "2021"

# Build as a library, not a binary (Trunk mounts it via the #[wasm_bindgen(start)] in lib.rs).
[lib]
crate-type = ["cdylib"]

[dependencies]
# Wire types + SQL builders shared with the Tauri backend
shared = { path = "shared" }

leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }

# Serialization for IPC models
serde = { version = "1", features = ["derive"] }

# Async delay (toast auto-dismiss)
gloo-timers = { version = "0.4", features = ["futures"] }

# Wasm / browser plumbing
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Storage", "StorageEvent", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlPreElement", "KeyboardEvent", "MouseEvent", "Event", "EventTarget", "MediaQueryList", "Navigator"] }

[workspace]
members = ["src-tauri", "shared"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep the wasm's `target_features` section: wasm-opt needs it to accept the
# bulk-memory ops rustc emits (strip = true makes `trunk build --release` fail).
[profile.release.package.querybook-ui]
strip = false
