# Builds the macOS app, the Windows installer and the Linux packages
# (AppImage, .deb, .rpm) on GitHub's machines.
#
# Runs only when something lands on main (work happens on branches, so pushing
# a branch or opening a pull request runs nothing). Changes that only touch
# Markdown files are skipped.
#
# - Every push to main is a release: the version is the highest vX.Y.Z tag with
#   the patch number + 1, or the version in src-tauri/tauri.conf.json if that is
#   higher (raise it on a branch for a minor or major release). The run builds all
#   three platforms with that version, signs the Windows installer through
#   SignPath (once SignPath is set up, see CONTRIBUTING.md) and publishes the
#   GitHub Release vX.Y.Z, which creates the tag. Notes: the CHANGELOG.md section
#   for that version if there is one, otherwise GitHub's notes from the merged PRs.
# - Nothing is committed back: main is closed to the workflow's token, so the
#   repo's version files only move when someone raises them.
# - The in-app updater: when the TAURI_SIGNING_PRIVATE_KEY secret is set, the release
#   carries the update files with their signatures (macOS .app.tar.gz, the AppImage, and
#   the Windows installer, signed after SignPath so the signature covers the final bytes)
#   and latest.json, which every installed Querybook reads from
#   releases/latest/download/latest.json. SHA256SUMS.txt lists every file. The release is
#   created as a draft and published once everything is uploaded, so latest.json never
#   points at a missing file.
# - Run it by hand (Actions → Release → Run workflow):
#   - channel "build-only": builds all three with the next version. No signing, no release.
#   - channel "staging": builds the version you give (e.g. 1.2.901) as a prerelease
#     staging-<version>, whose updater reads the fixed prerelease "updater-staging" instead
#     of the real releases. Install two staging builds to test an update end to end
#     without touching anyone's app. No SignPath.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      channel:
        description: "build-only, or staging (a prerelease for testing updates)"
        type: choice
        options: [build-only, staging]
        default: build-only
      staging_version:
        description: "Staging only: the version to build, higher than the last one installed (e.g. 1.2.901)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  plan:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7

      - name: Next version
        id: version
        env:
          CHANNEL_INPUT: ${{ inputs.channel }}
          STAGING_VERSION: ${{ inputs.staging_version }}
        run: |
          floor=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Every vX.Y.Z tag counts, even one whose release is still a draft: its number is taken.
          last=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<< "${last:-0.0.0}"
          version=$(printf '%s\n' "$major.$minor.$((patch + 1))" "$floor" | sort -V | tail -n 1)
          echo "Last tag v${last:-none}, tauri.conf.json $floor: next is $version."
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            { echo "version=$version"; echo "release=true"; echo "channel=stable"; } >> "$GITHUB_OUTPUT"
          elif [ "$CHANNEL_INPUT" = staging ]; then
            if ! [[ "$STAGING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A staging build needs staging_version, like 1.2.901"
              exit 1
            fi
            echo "Staging build $STAGING_VERSION."
            { echo "version=$STAGING_VERSION"; echo "release=true"; echo "channel=staging"; } >> "$GITHUB_OUTPUT"
          else
            echo "Started by hand: build only."
            { echo "version=$version"; echo "release=false"; echo "channel=build-only"; } >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest # Apple Silicon
            trunk: trunk-aarch64-apple-darwin.tar.gz
            bundles: app,dmg
            updater: true
          - name: Windows
            os: windows-latest
            trunk: trunk-x86_64-pc-windows-msvc.zip
            bundles: nsis
            # The installer's update signature is made after SignPath signs it (release job).
            updater: false
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on older distributions too.
            os: ubuntu-22.04
            trunk: trunk-x86_64-unknown-linux-gnu.tar.gz
            bundles: appimage,deb,rpm
            updater: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Trunk
        shell: bash
        run: |
          file="${{ matrix.trunk }}"
          url="https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$file"
          dir="$RUNNER_TEMP/trunk"
          mkdir -p "$dir" && cd "$dir"
          curl -fsSL -o "$file" "$url"
          curl -fsSL -o "$file.sha256" "$url.sha256"
          expected=$(cut -d' ' -f1 "$file.sha256")
          actual=$( (command -v sha256sum >/dev/null && sha256sum "$file" || shasum -a 256 "$file") | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Checksum mismatch for $file"
            exit 1
          fi
          case "$file" in
            *.zip) 7z x -y "$file" > /dev/null ;;
            *) tar -xzf "$file" ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"

      # SQLCipher uses OpenSSL on Windows, built from source; its build needs a
      # native Windows Perl (the Perl that comes with Git doesn't work).
      - name: Point OpenSSL's build at Strawberry Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --no-progress -y }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV

      # WebKitGTK and friends for Tauri; rpm for the .rpm bundle.
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev patchelf rpm

      # The version goes in here, not in tauri.conf.json: bundle names and metadata follow it.
      # Update files (.app.tar.gz and .sig) only when the signing key is set up; staging
      # builds read the staging manifest instead of the real one.
      - name: Build
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          trunk --version
          updater=false
          if [ "${{ matrix.updater }}" = true ] && [ "$HAS_KEY" = true ]; then updater=true; fi
          config="{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":$updater}"
          if [ "$CHANNEL" = staging ]; then
            config="$config,\"plugins\":{\"updater\":{\"endpoints\":[\"https://github.com/$GITHUB_REPOSITORY/releases/download/updater-staging/latest.json\"]}}"
          fi
          config="$config}"
          echo "$config"
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --bundles ${{ matrix.bundles }} --config "$config"

      - name: Collect the files
        shell: bash
        run: |
          version="${{ needs.plan.outputs.version }}"
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            cp target/release/bundle/dmg/*.dmg out/
            # ditto keeps the app's (ad-hoc) signature intact; a plain zip breaks it.
            ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Querybook.app \
              "out/Querybook_${version}_aarch64.app.zip"
            # The updater's bundle and its signature, named per version like the other files.
            if [ -f target/release/bundle/macos/Querybook.app.tar.gz ]; then
              cp target/release/bundle/macos/Querybook.app.tar.gz "out/Querybook_${version}_aarch64.app.tar.gz"
              cp target/release/bundle/macos/Querybook.app.tar.gz.sig "out/Querybook_${version}_aarch64.app.tar.gz.sig"
            fi
          elif [ "$RUNNER_OS" = Linux ]; then
            cp target/release/bundle/appimage/*.AppImage \
              target/release/bundle/deb/*.deb \
              target/release/bundle/rpm/*.rpm out/
            for sig in target/release/bundle/appimage/*.AppImage.sig target/release/bundle/deb/*.deb.sig \
              target/release/bundle/rpm/*.rpm.sig; do
              if [ -f "$sig" ]; then cp "$sig" out/; fi
            done
          else
            cp target/release/bundle/nsis/*-setup.exe out/
          fi
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: querybook-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # SignPath Foundation signs the installer for free (open-source projects).
  # Every request waits for an approver to approve it on signpath.io, so this
  # only runs for a real release, and only once the SignPath variables are set.
  sign-windows:
    name: Sign the Windows installer (SignPath)
    needs: [plan, build]
    if: needs.plan.outputs.channel == 'stable' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find the unsigned installer
        id: unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "querybook-Windows") | .id')
          if [ -z "$id" ]; then echo "::error::No querybook-Windows artifact in this run"; exit 1; fi
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"

      - name: Submit to SignPath and wait for approval
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400 # 4 hours to approve
          output-artifact-directory: signed

      - name: Check the signed files
        run: |
          ls -l signed
          ls signed/*-setup.exe > /dev/null

      # Same name, so the release job picks up the signed installer.
      - uses: actions/upload-artifact@v7
        with:
          name: querybook-Windows
          path: signed/*
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish the GitHub Release
    needs: [plan, build, sign-windows]
    # Runs when signing succeeded, or was skipped (SignPath isn't set up, or a staging build).
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.build.result == 'success' && needs.sign-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: querybook-*
          merge-multiple: true

      # The Windows installer is signed for the updater here, after SignPath changed its
      # bytes. deb and rpm get a signature too if the bundler didn't make one.
      - name: Sign the update files
        if: env.HAS_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd out
          rm -f ./*-setup.exe.sig
          for f in ./*-setup.exe ./*.deb ./*.rpm; do
            if [ ! -f "$f" ] || [ -f "$f.sig" ]; then continue; fi
            npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" signer sign "$f"
          done
          ls -l

      # Every signature must check out against the public key the app ships with, or
      # installed apps would refuse the update.
      - name: Verify the update signatures
        if: env.HAS_KEY == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends minisign > /dev/null
          node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" | base64 -d > "$RUNNER_TEMP/updater.pub"
          for sig in out/*.sig; do
            base64 -d "$sig" > "$RUNNER_TEMP/check.minisig"
            minisign -V -q -p "$RUNNER_TEMP/updater.pub" -m "${sig%.sig}" -x "$RUNNER_TEMP/check.minisig"
            echo "ok ${sig%.sig}"
          done

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="[$VERSION]" 'index($0, "## " v) == 1 {on = 1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG section for $VERSION: using GitHub's notes (users see these in the update prompt)."
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$VERSION" \
              -f target_commitish="$GITHUB_SHA" --jq .body > notes.md || echo "Querybook $VERSION" > notes.md
          fi
          cat notes.md

      - name: Updater manifest and checksums
        run: |
          if [ "$CHANNEL" = staging ]; then tag="staging-$VERSION"; else tag="v$VERSION"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          # Every file carries this version (a stale name would break the manifest's links).
          for f in out/*; do
            case "$f" in
              *"_${VERSION}_"* | *"-${VERSION}-"*) ;;
              *) echo "::error::$f doesn't carry version $VERSION"; exit 1 ;;
            esac
          done
          (cd out && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt")
          mv "$RUNNER_TEMP/SHA256SUMS.txt" out/
          if [ "$HAS_KEY" = true ]; then
            node scripts/release/latest-json.mjs out "$VERSION" "$tag" notes.md > out/latest.json
            cat out/latest.json
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set: no update files, so installed apps won't be offered this release."
          fi

      # Created as a draft, then published once every file is up: releases/latest (and so
      # latest.json) keeps pointing at the previous release until this one is complete.
      - name: Publish the release (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          if [ "$CHANNEL" = stable ] && [ "${{ needs.sign-windows.result }}" != success ]; then
            echo "::warning::The Windows installer is not signed (SignPath isn't set up)."
          fi
          if [ "$CHANNEL" = staging ]; then
            flags=(--prerelease); title="Querybook $VERSION (staging)"
          else
            flags=(); title="Querybook $VERSION"
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "${flags[@]}"
          fi
          # A draft left by a run that failed while uploading is finished the same way.
          gh release upload "$TAG" out/* --clobber
          if [ "$CHANNEL" = staging ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --target "$GITHUB_SHA" --draft=false --latest
          fi

      # Staging builds read their manifest from this one fixed prerelease.
      - name: Point the staging updater at this build
        if: env.CHANNEL == 'staging' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view updater-staging > /dev/null 2>&1; then
            gh release create updater-staging --prerelease --target "$GITHUB_SHA" \
              --title "Updater staging channel" --notes "latest.json for staging builds. Not for download."
          fi
          gh release upload updater-staging out/latest.json --clobber

