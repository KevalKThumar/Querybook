# Builds the Windows installer and the macOS app on GitHub's machines.
#
# - Push a tag such as v1.0.0: builds both, then creates a draft GitHub Release
#   with the files attached and the notes from CHANGELOG.md. Check it, then
#   press Publish on GitHub.
# - Run it by hand (Actions → Release → Run workflow): builds both and keeps the
#   files as workflow artifacts. No release is created.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest # Apple Silicon
            trunk: trunk-aarch64-apple-darwin.tar.gz
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            trunk: trunk-x86_64-pc-windows-msvc.zip
            bundles: nsis
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Trunk
        shell: bash
        run: |
          file="${{ matrix.trunk }}"
          url="https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$file"
          dir="$RUNNER_TEMP/trunk"
          mkdir -p "$dir" && cd "$dir"
          curl -fsSL -o "$file" "$url"
          curl -fsSL -o "$file.sha256" "$url.sha256"
          expected=$(cut -d' ' -f1 "$file.sha256")
          actual=$( (command -v sha256sum >/dev/null && sha256sum "$file" || shasum -a 256 "$file") | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Checksum mismatch for $file"
            exit 1
          fi
          case "$file" in
            *.zip) 7z x -y "$file" > /dev/null ;;
            *) tar -xzf "$file" ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"

      # SQLCipher uses OpenSSL on Windows, built from source; its build needs a
      # native Windows Perl (the Perl that comes with Git doesn't work).
      - name: Point OpenSSL's build at Strawberry Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --no-progress -y }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          trunk --version
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --bundles ${{ matrix.bundles }}

      - name: Collect the files
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            cp target/release/bundle/dmg/*.dmg out/
            # ditto keeps the app's (ad-hoc) signature intact; a plain zip breaks it.
            ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Querybook.app \
              "out/Querybook_${version}_aarch64.app.zip"
          else
            cp target/release/bundle/nsis/*-setup.exe out/
          fi
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: querybook-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" 'index($0, "## " v) == 1 {on = 1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md; fi
          cat notes.md

      - name: Create the draft release (or update its files)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --draft --verify-tag \
              --title "Querybook ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
