# Builds the Windows installer and the macOS app on GitHub's machines.
#
# Runs only when something lands on main (work happens on branches, so pushing
# a branch or opening a pull request runs nothing). Changes that only touch
# Markdown files are skipped.
#
# - Every push to main builds both platforms and keeps the files as workflow
#   artifacts.
# - If the version in src-tauri/tauri.conf.json has no published release yet,
#   the run also signs the Windows installer through SignPath (once SignPath is
#   set up, see CONTRIBUTING.md) and creates or refreshes a draft GitHub Release
#   vX.Y.Z with the files and the notes from CHANGELOG.md. Check it, then press
#   Publish on GitHub; publishing creates the tag.
# - Run it by hand (Actions → Release → Run workflow): builds both. No signing,
#   no release.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  plan:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this version released yet?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # This endpoint only finds published releases, never drafts.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already published: build only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "Started by hand: build only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version isn't published yet: build, sign and draft the release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest # Apple Silicon
            trunk: trunk-aarch64-apple-darwin.tar.gz
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            trunk: trunk-x86_64-pc-windows-msvc.zip
            bundles: nsis
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Trunk
        shell: bash
        run: |
          file="${{ matrix.trunk }}"
          url="https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$file"
          dir="$RUNNER_TEMP/trunk"
          mkdir -p "$dir" && cd "$dir"
          curl -fsSL -o "$file" "$url"
          curl -fsSL -o "$file.sha256" "$url.sha256"
          expected=$(cut -d' ' -f1 "$file.sha256")
          actual=$( (command -v sha256sum >/dev/null && sha256sum "$file" || shasum -a 256 "$file") | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Checksum mismatch for $file"
            exit 1
          fi
          case "$file" in
            *.zip) 7z x -y "$file" > /dev/null ;;
            *) tar -xzf "$file" ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"

      # SQLCipher uses OpenSSL on Windows, built from source; its build needs a
      # native Windows Perl (the Perl that comes with Git doesn't work).
      - name: Point OpenSSL's build at Strawberry Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --no-progress -y }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          trunk --version
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --bundles ${{ matrix.bundles }}

      - name: Collect the files
        shell: bash
        run: |
          version="${{ needs.plan.outputs.version }}"
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            cp target/release/bundle/dmg/*.dmg out/
            # ditto keeps the app's (ad-hoc) signature intact; a plain zip breaks it.
            ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Querybook.app \
              "out/Querybook_${version}_aarch64.app.zip"
          else
            cp target/release/bundle/nsis/*-setup.exe out/
          fi
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: querybook-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # SignPath Foundation signs the installer for free (open-source projects).
  # Every request waits for an approver to approve it on signpath.io, so this
  # only runs for a release, and only once the SignPath variables are set.
  sign-windows:
    name: Sign the Windows installer (SignPath)
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find the unsigned installer
        id: unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "querybook-Windows") | .id')
          if [ -z "$id" ]; then echo "::error::No querybook-Windows artifact in this run"; exit 1; fi
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"

      - name: Submit to SignPath and wait for approval
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400 # 4 hours to approve
          output-artifact-directory: signed

      - name: Check the signed files
        run: |
          ls -l signed
          ls signed/*-setup.exe > /dev/null

      # Same name, so the release job picks up the signed installer.
      - uses: actions/upload-artifact@v7
        with:
          name: querybook-Windows
          path: signed/*
          if-no-files-found: error
          overwrite: true

  release:
    name: Draft the GitHub Release
    needs: [plan, build, sign-windows]
    # Runs when signing succeeded, or was skipped because SignPath isn't set up yet.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.build.result == 'success' && needs.sign-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: querybook-*
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="[$VERSION]" 'index($0, "## " v) == 1 {on = 1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md; fi
          cat notes.md

      - name: Create the draft release (or refresh it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          ls -l out
          if [ "${{ needs.sign-windows.result }}" != success ]; then
            echo "::warning::The Windows installer is not signed (SignPath isn't set up)."
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            # A draft from an earlier push of this version: point it at this commit.
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file notes.md
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --draft --target "$GITHUB_SHA" \
              --title "Querybook $VERSION" --notes-file notes.md
          fi
