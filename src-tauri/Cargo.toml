[package]
name = "querybook"
version = "1.1.0"
description = "Querybook — SQLite / SQLCipher browser"
authors = ["Keval Thumar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KevalKThumar/Querybook"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "querybook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shared = { path = "../shared" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
# Canonical paths without Windows' `\\?\` prefix (a pass-through elsewhere).
dunce = "1"

# Windows: a second launch (double-click in File Explorer) hands its files to the running app.
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"

# SQLCipher 4 bundled. macOS uses CommonCrypto; elsewhere OpenSSL is built from source.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
