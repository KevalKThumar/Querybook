[package]
name = "querybook"
version = "1.2.0"
description = "Querybook — SQLite / SQLCipher browser"
authors = ["Keval Thumar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KevalKThumar/Querybook"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "querybook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shared = { path = "../shared" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Opens the Help links and the logs folder (called from Rust only, never from the page).
tauri-plugin-opener = "2"
# The OS name and version in crash reports and About.
os_info = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
# Canonical paths without Windows' `\\?\` prefix (a pass-through elsewhere).
dunce = "1"

# Windows and Linux: a second launch (double-click in File Explorer or the file manager)
# hands its files to the running app.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# SQLCipher 4 bundled. macOS uses CommonCrypto; elsewhere OpenSSL is built from source.
# `hooks`: the authorizer that limits what an imported SQL script may run.
# objc2: AppKit's recent documents, which the Dock icon's menu lists (already used by tao, wry, rfd).
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher", "hooks"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDocumentController"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }

# The system's recent documents (already used by tauri, tao and muda).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
